{% extends base_template %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="font-serif mb-0" style="font-size:1.3rem;">Terms</h2>
  <a href="{% url 'term-create' %}" class="btn btn-primary btn-sm">Add Term</a>
</div>
<div class="grid-wrap">
<table class="table gradebook mb-0">
  <thead><tr><th class="name-col">Name</th><th>Academic Year</th><th>Order</th><th></th></tr></thead>
  <tbody>
    {% for t in terms %}
    <tr>
      <td class="name-col">{{ t.name }}</td>
      <td>{{ t.academic_year.name }}</td>
      <td>{{ t.order }}</td>
      <td><a href="{% url 'term-update' t.pk %}" class="btn btn-sm btn-outline-primary">Edit</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="text-slate">No terms yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
