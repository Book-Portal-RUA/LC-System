{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — GEP Student Assessment System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'gep/css/custom.css' %}">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
<div class="container" style="max-width: 400px;">
  <div class="text-center mb-4">
    <h1 class="font-serif mb-0" style="font-size:1.5rem;">General English Program</h1>
    <p class="text-slate mb-0">Student Assessment System</p>
  </div>
  <div class="sheet">
    {% if form.errors %}
      <div class="alert alert-danger py-2">Incorrect username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input type="text" name="username" class="form-control" id="id_username" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input type="password" name="password" class="form-control" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
